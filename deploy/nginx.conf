# Конкурс оценивания — конфиг Nginx (HTTPS).
# Замените DOMAIN на ваш домен (например, konkurs.example.com).
# Файл размещается в /etc/nginx/sites-available/konkurs и включается симлинком
# в /etc/nginx/sites-enabled/konkurs.
#
# Сертификаты добавляются certbot автоматически:
#   certbot --nginx -d DOMAIN -d www.DOMAIN

upstream konkurs_app {
    server unix:/var/www/konkurs/konkurs.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    # ACME-челлендж Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN www.DOMAIN;

    # Пути к сертификатам, выставленные certbot
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Заголовки безопасности
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/konkurs.access.log;
    error_log  /var/log/nginx/konkurs.error.log;

    location /static/ {
        alias /var/www/konkurs/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://konkurs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
