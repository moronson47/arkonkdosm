{% extends 'base.html' %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<h1>Смена пароля</h1>
{% if g.user['must_change_password'] %}
  <div class="flash info" style="border-radius:10px">
    При первом входе необходимо сменить пароль. Новый пароль — не менее 8 символов.
  </div>
{% endif %}

<div class="card">
  <form method="post" action="{{ url_for('change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field">
      <label for="old_password">Текущий пароль</label>
      <input type="password" id="old_password" name="old_password" autocomplete="current-password" required>
    </div>

    <div class="field">
      <label for="new_password">Новый пароль (минимум 8 символов)</label>
      <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" required>
    </div>

    <div class="field">
      <label for="confirm_password">Повторите новый пароль</label>
      <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>
    </div>

    <button class="btn btn-block" type="submit">Сохранить пароль</button>
  </form>
</div>
{% endblock %}
